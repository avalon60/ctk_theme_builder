[project]
name = "ctk-theme-builder"
version = "3.2.13"
description = "A desktop theme editor for building and previewing CustomTkinter themes."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
  { name = "Clive Bostock" },
]
license = "MIT"
keywords = ["customtkinter", "tkinter", "theme", "gui", "desktop"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = [
  "colorharmonies==1.0.5",
  "colour==0.1.5",
  "contourpy==1.3.2",
  "CTkMessagebox==2.5",
  "ctktooltip (==0.9)",
  "customtkinter==5.2.2",
  "cycler==0.12.1",
  "darkdetect==0.8.0",
  "distro==1.9.0",
  "fonttools==4.59.0",
  "importlib-resources==6.1.1",
  "kiwisolver==1.4.8",
  "loguru==0.7.2",
  "matplotlib==3.10.5",
  "numpy==2.2.6",
  "packaging==23.2",
  "pathvalidate==3.2.0",
  "pillow==11.3.0",
  "pyparsing==3.1.1",
  "pyperclip==1.8.2",
  "python-dateutil==2.8.2",
  "scikit-build==0.17.6",
  "six==1.16.0",
  "tomli==2.0.1",
  "zipp==3.15.0",
  "bump2version (>=1.0.1,<2.0.0)",
  "ctkfontawesome[images] (>=0.6.0,<0.7.0)",
]

[project.urls]
Homepage = "https://github.com/avalon60/ctk_theme_builder"
Repository = "https://github.com/avalon60/ctk_theme_builder"
Issues = "https://github.com/avalon60/ctk_theme_builder/issues"

[project.scripts]
ctk-theme-builder = "ctk_tb.controller.ctk_theme_builder:main"
ctktb-migrate-assets = "ctk_tb.controller.migrate_assets:main"

[tool.poetry]
packages = [
  { include = "ctk_tb" },
]
include = [
  { path = "assets", format = ["sdist", "wheel"] },
  { path = "user_themes", format = ["sdist", "wheel"] },
  { path = "README.md", format = ["sdist", "wheel"] },
  { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
